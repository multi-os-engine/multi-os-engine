import org.moe.prebuilts.XcodeBuild
import org.moe.prebuilts.Script

task('fetch_boot_jdk', type: Script) {
    def bootJDK = file("build/bootJDK")
    outputs.dir(bootJDK)

    progress 'Fetching boot JDK'
    rawWorkDir external.svm.mx

    exec "./mx",
            "-y", "--no-warning",
            "fetch-jdk",
            "--to", bootJDK.absolutePath,
            "--alias", "jdk25",
            "labsjdk-ce-latest", "ce-25.0.1+8-jvmci-b01"
}

task('jdk_gensrc', type: Script) {
    def bootJDK = file("build/bootJDK")
    def builtJdkDir = file("build/labsjdk")
    dependsOn(fetch_boot_jdk)
    inputs.dir(bootJDK)
    inputs.dir(external.svm.openjdk)
    outputs.dir(builtJdkDir)

    doFirst {
        delete builtJdkDir
    }

    progress 'Copy jdk'
    copy file(external.svm.openjdk), builtJdkDir

    progress 'Configure jdk'
    rawWorkDir "${builtJdkDir}"

    exec "sh", "-c", "patch -p1 < ${file("add_ios_build_support.patch").absolutePath}"


    def JVMCI_VERSION = "jvmci-25.0.1-b01"
    // For whatever reason setting "--with-boot-jdk" does not work
    env "JAVA_HOME", file(bootJDK.absolutePath + "/jdk25/Contents/Home").absolutePath
    env 'MX_PYTHON', 'python3'
    exec "sh", "configure", "--with-conf-name=labsjdk", "--with-version-opt=$JVMCI_VERSION", "--with-version-pre=",
            "--with-vendor-name=GraalVM Community", "--with-vendor-url=https://www.graalvm.org/", "--with-vendor-bug-url=https://github.com/oracle/graal/issues",
            "--with-vendor-vm-bug-url=https://github.com/oracle/graal/issues", "--with-extra-cflags=-Wno-error=macro-redefined",  "--with-extra-cxxflags=-Wno-error=vla-cxx-extension"
    progress 'Make jdk'
    exec "make", "CONF_NAME=labsjdk", "graal-builder-image"
}

XcodeBuild.createTask(project, "libjava", "ios", "iphoneos", "Debug")
        .cond_buildopt(buildfilter.ios.archs, "ARCHS")
        .cond_buildopt(buildfilter.ios.archs != null, "ONLY_ACTIVE_ARCH", "YES")
        .dependsOn('jdk_gensrc')
XcodeBuild.createTask(project, "libjava", "ios", "iphoneos", "Release")
        .cond_buildopt(buildfilter.ios.archs, "ARCHS")
        .cond_buildopt(buildfilter.ios.archs != null, "ONLY_ACTIVE_ARCH", "YES")
        .dependsOn('jdk_gensrc')
XcodeBuild.createTask(project, "libjava", "ios", "iphonesimulator", "Debug")
        .cond_buildopt(buildfilter.ios.archs, "ARCHS")
        .cond_buildopt(buildfilter.ios.archs != null, "ONLY_ACTIVE_ARCH", "YES")
        .dependsOn('jdk_gensrc')
XcodeBuild.createTask(project, "libjava", "ios", "iphonesimulator", "Release")
        .cond_buildopt(buildfilter.ios.archs, "ARCHS")
        .cond_buildopt(buildfilter.ios.archs != null, "ONLY_ACTIVE_ARCH", "YES")
        .dependsOn('jdk_gensrc')
