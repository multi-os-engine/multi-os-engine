import org.moe.prebuilts.Script;

tasks.register('fetch_boot_jdk', Script) {
    outputs.dir(bootJdkDir)

    progress 'Fetching boot JDK'
    rawWorkDir = external.svm.mx

    exec "./mx",
            "-y", "--no-warning",
            "fetch-jdk",
            "--to", file(bootJdkDir).absolutePath,
            "--alias", bootJdkDirAlias,
            "labsjdk-ce-latest", "ce-25.0.1+8-jvmci-b01"
}

tasks.register('build_graal_dist', Script) {
    dependsOn(bootJdkTask)
    inputs.dir(bootJdkDir)
    inputs.dir(external.svm.graal)
    outputs.dir(graalDist)

    workDir = 'graalBuild'

    progress 'Copying graal'
    rsync file(external.svm.graal), workDir

    progress 'Build graal dist'
    workDir = 'graalBuild/vm/'
    exec "${external.svm.mx}/mx", "--java-home", file(bootJdkDirHome).absolutePath, "--env", "ce", "build"

    progress 'Copy build distribution'
    exec "bash", "-c", "rsync -a --delete \$(${external.svm.mx}/mx --java-home ${file(bootJdkDirHome).absolutePath} --env ce graalvm-home)/ ${file(graalDist).absolutePath}/";
}

ext {
    bootJdkDir = file("build/bootJDK")
    bootJdkDirAlias = "jdk25"
    bootJdkDirHome = file("$bootJdkDir/$bootJdkDirAlias/Contents/Home")
    bootJdkTask = tasks.named("fetch_boot_jdk")

    graalDist = file("build/graalDist")
    graalDistTask = tasks.named("build_graal_dist")
}

subprojects {
    ext {
        buildfilter = [:]
        buildfilter.ios = [:]
        buildfilter.macos = [:]

        if (rootProject.hasProperty("moe.buildfilter.ios.config"))
            buildfilter.ios.config = rootProject.property("moe.buildfilter.ios.config").toString()
        if (rootProject.hasProperty("moe.buildfilter.ios.sdk"))
            buildfilter.ios.sdk = rootProject.property("moe.buildfilter.ios.sdk").toString()
        if (rootProject.hasProperty("moe.buildfilter.ios.archs"))
            buildfilter.ios.archs = rootProject.property("moe.buildfilter.ios.archs").toString()
        if (buildfilter.ios.archs && !buildfilter.ios.sdk) {
            throw new GradleException("Specifying 'moe.buildfilter.ios.archs' requires 'moe.buildfilter.ios.sdk'")
        }

        if (rootProject.hasProperty("moe.buildfilter.macos.config"))
            buildfilter.macos.config = rootProject.property("moe.buildfilter.macos.config").toString()
    }

    def subproject = it
    afterEvaluate {
        if (subproject.tasks.findByName('clean')) return
        subproject.tasks.register('clean', Delete) {
            delete subproject.file('build')
        }
    }
}
