import org.moe.prebuilts.XcodeBuild

plugins {
    id 'org.moe.buildtools'
}

apply plugin: 'maven-publish'

ext {
    nativeOutputs = []
}

def useAsan = providers.gradleProperty("moe.use.addresssanitizer").isPresent()

def createXcodeTask = { xcodeproject, configuration, sdk, target ->
    def productDest = layout.buildDirectory.dir("xcode/${configuration}").get().asFile.path
    if (target == 'natj') {
        project.nativeOutputs.add("${productDest}/libnatj.dylib")
    }
    return tasks.register("build_${target}_${configuration}_${sdk}", XcodeBuild) {
        xcodeProject.set(file(xcodeproject))
        setConfiguration(configuration)
        setTarget(target)
        setSdk(sdk)
        if (useAsan) {
            extraArgs('-enableAddressSanitizer', 'YES')
        }
        dependsOn ":prebuild_libffi_macos"
        inputs.dir rootProject.file('src')
        inputs.dir file(xcodeproject)
        outputs.upToDateWhen { false }
        if (target == 'natj') {
            outputs.file "${productDest}/libnatj.dylib"
        } else {
            dependsOn "build_natj_${configuration}_${sdk}"
        }
        if (target == 'TestClassesCxx') {
            dependsOn ':natj-cxxtests:processCxxTests'
        }
    }
}

// Register all XcodeBuild tasks at project evaluation time
def xcodeTasks = { target ->
    [createXcodeTask("natj.xcodeproj", "Release", "macosx", target),
     createXcodeTask("natj.xcodeproj", "Debug", "macosx", target)]
}

def buildNatj = xcodeTasks("natj")
def buildTestClasses = xcodeTasks("TestClasses")
def buildTestClassesC = xcodeTasks("TestClassesC")
def buildTestClassesCxx = xcodeTasks("TestClassesCxx")
def buildTestClassesObjC = xcodeTasks("TestClassesObjC")

// Create build task
tasks.register('build') {
    dependsOn buildNatj
}

// Create test tasks
tasks.register('build_TestClasses_macosx') {
    dependsOn buildTestClasses
}

tasks.register('build_TestClassesC_macosx') {
    dependsOn buildTestClassesC
}

tasks.register('build_TestClassesCxx_macosx') {
    dependsOn buildTestClassesCxx
}

tasks.register('build_TestClassesObjC_macosx') {
    dependsOn buildTestClassesObjC
}

tasks.register('buildAll') {
    dependsOn 'build', 'build_TestClasses_macosx', 'build_TestClassesC_macosx', 'build_TestClassesCxx_macosx', 'build_TestClassesObjC_macosx'
}

// Create clean task
tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

// Setup publishing
tasks.publish.dependsOn build
publishing {
    publications {
        mavenNative(MavenPublication) {
            artifactId 'natj-mac'

            for (o in nativeOutputs) {
                artifact source: o, extension: 'dylib', classifier: new File(o).getParentFile().getName()
            }
        }
    }
}
