import org.moe.prebuilts.XcodeBuild

plugins {
    id 'org.moe.buildtools'
}

apply plugin: 'maven-publish'

ext {
    nativeOutputs = []
}

def useAsan = providers.gradleProperty("moe.use.addresssanitizer").isPresent()
def xcodeProjectDir = file("natj.xcodeproj")

def registerNativeTarget = { String cfg, String sdkArg, String tgt ->
    def productDest = "$buildDir/xcode/${cfg}-${sdkArg}"
    def outputFile = "${productDest}/libnatj.a"
    project.nativeOutputs.add(outputFile)
    return tasks.register("build_${tgt}_${cfg}_${sdkArg}", XcodeBuild) { XcodeBuild t ->
        t.xcodeProject.set(xcodeProjectDir)
        t.configuration = cfg
        t.target = tgt
        t.sdk = sdkArg
        if (useAsan) {
            t.extraArgs('-enableAddressSanitizer', 'YES')
        }
        t.dependsOn ":prebuild_libffi_ios"
        t.inputs.dir rootProject.file('src')
        t.inputs.dir xcodeProjectDir
        t.outputs.file outputFile
        t.outputs.upToDateWhen { false }
    }
}

// Create build task
task build {
    dependsOn registerNativeTarget("Release", "iphoneos", "natj")
    dependsOn registerNativeTarget("Release", "iphonesimulator", "natj")
    dependsOn registerNativeTarget("Debug", "iphoneos", "natj")
    dependsOn registerNativeTarget("Debug", "iphonesimulator", "natj")
}

task buildAll {
    dependsOn build
}

// Create clean task
task clean {
    doLast {
        delete buildDir
    }
}

// Setup publishing
tasks.publish.dependsOn build
publishing {
    publications {
        mavenNative(MavenPublication) {
            artifactId 'natj-ios'

            for (o in nativeOutputs) {
                artifact source: o, extension: 'a', classifier: new File(o).getParentFile().getName()
            }
        }
    }
}
