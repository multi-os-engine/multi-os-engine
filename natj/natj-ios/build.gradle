import org.moe.prebuilts.XcodeBuild

plugins {
    id 'org.moe.buildtools'
}

apply plugin: 'maven-publish'

ext {
    nativeOutputs = []
}

def useAsan = providers.gradleProperty("moe.use.addresssanitizer").isPresent()

def buildNativeTarget = { xcodeproject, configuration, sdk, target ->
    def productDest = "$buildDir/xcode/${configuration}-${sdk}"
    def outputFile = "${productDest}/libnatj.a"
    project.nativeOutputs.add(outputFile)
    return tasks.register("build_${target}_${configuration}_${sdk}", XcodeBuild) {
        xcodeProject.set(file(xcodeproject))
        setConfiguration(configuration)
        setTarget(target)
        setSdk(sdk)
        if (useAsan) {
            extraArgs('-enableAddressSanitizer', 'YES')
        }
        dependsOn ":prebuild_libffi_ios"
        inputs.dir rootProject.file('src')
        inputs.dir file(xcodeproject)
        outputs.file outputFile
        outputs.upToDateWhen { false }
    }
}

// Create build task
task build {
    dependsOn buildNativeTarget("natj.xcodeproj", "Release", "iphoneos", "natj")
    dependsOn buildNativeTarget("natj.xcodeproj", "Release", "iphonesimulator", "natj")
    dependsOn buildNativeTarget("natj.xcodeproj", "Debug", "iphoneos", "natj")
    dependsOn buildNativeTarget("natj.xcodeproj", "Debug", "iphonesimulator", "natj")
}

task buildAll {
    dependsOn build
}

// Create clean task
task clean {
    doLast {
        delete buildDir
    }
}

// Setup publishing
tasks.publish.dependsOn build
publishing {
    publications {
        mavenNative(MavenPublication) {
            artifactId 'natj-ios'

            for (o in nativeOutputs) {
                artifact source: o, extension: 'a', classifier: new File(o).getParentFile().getName()
            }
        }
    }
}
