plugins {
    id 'de.undercouch.download' version '5.4.0'
    id "org.jetbrains.kotlin.jvm"
}

targetCompatibility = 1.8
sourceCompatibility = 1.8

dependencies {
    implementation project(':moe.tools.common')
}

compileKotlin {
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// Base configuration
def graalvmVersion = "25.0.1"
def baseDownloadUrl = "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-${graalvmVersion}"

// Helper functions
def getGraalVMArm64Home() {
    return file("build/capCacheGeneration/arm64/graalvm/graalvm-arm64")
}

def getGraalVMx86Home() {
    return file("build/capCacheGeneration/x86_64/graalvm/graalvm-x86_64")
}

// ARM64 tasks
tasks.register("downloadGraalVMArm64", Download) {
    src "${baseDownloadUrl}/graalvm-community-jdk-${graalvmVersion}_macos-aarch64_bin.tar.gz"
    dest file("build/capCacheGeneration/arm64/downloads/graalvm.tar.gz")
    onlyIfModified true
}

tasks.register("downloadGraalVMx86", Download) {
    src "${baseDownloadUrl}/graalvm-community-jdk-${graalvmVersion}_macos-x64_bin.tar.gz"
    dest file("build/capCacheGeneration/x86_64/downloads/graalvm.tar.gz")
    onlyIfModified true
}

tasks.register("verifyGraalVMArm64", Verify) {
    dependsOn downloadGraalVMArm64
    src file("build/capCacheGeneration/arm64/downloads/graalvm.tar.gz")
    checksum '066339f24a8ab5c161548491a9400f7344e7761a1e46f8979e76c7ef11d5bc76'
    algorithm 'SHA-256'
}

tasks.register("verifyGraalVMx86", Verify) {
    dependsOn downloadGraalVMx86
    src file("build/capCacheGeneration/x86_64/downloads/graalvm.tar.gz")
    checksum 'a3d895b4cd1c783badbd277ec70409806bd4102fca0d2a60dbaeb0bab41aec30'
    algorithm 'SHA-256'
}

tasks.register("extractGraalVMArm64", Exec) {
    dependsOn verifyGraalVMArm64

    workingDir file("build/capCacheGeneration/arm64/graalvm")
    executable "tar"
    args = ["-xzf", "../downloads/graalvm.tar.gz", "--strip-components=1"]

    doFirst {
        file("build/capCacheGeneration/arm64/graalvm").mkdirs()
    }

    doLast {
        def extractedDir = file("build/capCacheGeneration/arm64/graalvm")
        def renamedDir = file("build/capCacheGeneration/arm64/graalvm/graalvm-arm64")

        renamedDir.mkdirs()
        extractedDir.listFiles().findAll { it.name != "graalvm-arm64" }.each { file ->
            file.renameTo(new File(renamedDir, file.name))
        }

        exec {
            executable = "chmod"
            args = ["-R", "u+w", renamedDir]
            ignoreExitValue = true
        }

        exec {
            executable = "xattr"
            args = ["-dr", "com.apple.quarantine", renamedDir]
            ignoreExitValue = true
        }
    }
}

tasks.register("extractGraalVMx86", Exec) {
    dependsOn verifyGraalVMx86

    workingDir file("build/capCacheGeneration/x86_64/graalvm")
    executable "tar"
    args = ["-xzf", "../downloads/graalvm.tar.gz", "--strip-components=1"]

    doFirst {
        file("build/capCacheGeneration/x86_64/graalvm").mkdirs()
    }

    doLast {
        def extractedDir = file("build/capCacheGeneration/x86_64/graalvm")
        def renamedDir = file("build/capCacheGeneration/x86_64/graalvm/graalvm-x86_64")

        renamedDir.mkdirs()
        extractedDir.listFiles().findAll { it.name != "graalvm-x86_64" }.each { file ->
            file.renameTo(new File(renamedDir, file.name))
        }

        exec {
            executable = "chmod"
            args = ["-R", "u+w", renamedDir]
            ignoreExitValue = true
        }

        exec {
            executable = "xattr"
            args = ["-dr", "com.apple.quarantine", renamedDir]
            ignoreExitValue = true
        }
    }
}

tasks.register("generateDummyClass") {
    doLast {
        def tempDir = file("build/tmp/")
        tempDir.mkdirs()

        def dummyClass = file("${tempDir}/Dummy.java")
        dummyClass.text = '''
            public class Dummy {
                public static void main(String[] args) {}
            }
        '''

        def compiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(21)
        }

        exec {
            executable = compiler.get().executablePath
            args = ["-d", tempDir, dummyClass]
        }
    }
}

tasks.register("generateQueryCodeArm64", Exec) {
    dependsOn generateDummyClass, extractGraalVMArm64
    def graalvmHome = getGraalVMArm64Home()

    executable = "${graalvmHome}/Contents/Home/bin/native-image"

    args = [
            "-H:+UnlockExperimentalVMOptions",
            "-H:QueryCodeDir=${file("build/capCacheGeneration/arm64/querySrc/")}",
            "-H:+ExitAfterQueryCodeGeneration",
            "-H:+JDWP",
            "-cp", file("build/tmp/"),
            "Dummy"
    ]
}

tasks.register("generateQueryCodex86_64", Exec) {
    dependsOn generateDummyClass, extractGraalVMx86
    def graalvmHome = getGraalVMx86Home()

    executable = "${graalvmHome}/Contents/Home/bin/native-image"

    args = [
            "-H:+UnlockExperimentalVMOptions",
            "-H:QueryCodeDir=${file("build/capCacheGeneration/x86_64/querySrc/")}",
            "-H:+ExitAfterQueryCodeGeneration",
            "-H:+JDWP",
            "-cp", file("build/tmp/"),
            "Dummy"
    ]
}

tasks.register("runQueryCodeArm64") {
    dependsOn generateQueryCodeArm64
    def graalvmArm64Home = getGraalVMArm64Home()

    doLast {
        def arm64QuerySource = file("build/capCacheGeneration/arm64/querySrc")
        def queryOut = file("build/capCacheGeneration/arm64/queryOut")
        def arm64Out = file("src/main/resources/cap_arm64")

        queryOut.mkdirs()
        arm64Out.mkdirs()

        if (arm64QuerySource.exists()) {
            for (f in arm64QuerySource.listFiles()) {
                def nameWithoutExt = f.name.substring(0, f.name.lastIndexOf('.'))
                exec {
                    workingDir = queryOut
                    executable = "clang"
                    args = ["-x", "objective-c", "-I${graalvmArm64Home}/Contents/Home/include", "-I${graalvmArm64Home}/Contents/Home/include/darwin", f, "-o", nameWithoutExt]
                }
                exec {
                    commandLine = [file(queryOut.absolutePath + "/" + nameWithoutExt)]
                    standardOutput = new FileOutputStream(file("src/main/resources/cap_arm64/${nameWithoutExt}.cap"))
                }
            }
        }
    }
}

tasks.register("runQueryCodex86_64") {
    dependsOn generateQueryCodex86_64
    def graalvmx86Home = getGraalVMx86Home()

    doLast {
        def x86_64QuerySource = file("build/capCacheGeneration/x86_64/querySrc")
        def queryOut = file("build/capCacheGeneration/x86_64/queryOut")
        def x86_64Out = file("src/main/resources/cap_x86_64")

        queryOut.mkdirs()
        x86_64Out.mkdirs()

        if (x86_64QuerySource.exists()) {
            for (f in x86_64QuerySource.listFiles()) {
                def nameWithoutExt = f.name.substring(0, f.name.lastIndexOf('.'))
                exec {
                    workingDir = queryOut
                    executable = "clang"
                    args = ["-x", "objective-c", "-arch", "x86_64", "-I${graalvmx86Home}/Contents/Home/include", "-I${graalvmx86Home}/Contents/Home/include/darwin", f, "-o", nameWithoutExt]
                }
                exec {
                    executable = "arch"
                    args = ["-x86_64", file(queryOut.absolutePath + "/" + nameWithoutExt)]
                    standardOutput = new FileOutputStream(file("src/main/resources/cap_x86_64/${nameWithoutExt}.cap"))
                }
            }
        }
    }
}

tasks.register("runQueryCode") {
    dependsOn runQueryCodeArm64, runQueryCodex86_64
}